<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="foldArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#d9534f"/>
    </marker>
  </defs>

  <!-- legend -->
  <text x="40" y="24" font-size="12.5" fill="#808080">carrier 500 Hz &#183; modulator 200 Hz with harmonics at 400 and 600 Hz</text>

  <!-- negative-frequency region -->
  <rect x="30" y="40" width="140" height="190" fill="#808080" opacity="0.10"/>
  <text x="100" y="56" font-size="12" fill="#808080" text-anchor="middle">negative frequencies</text>

  <!-- axis -->
  <line x1="30" y1="230" x2="730" y2="230" stroke="#808080" stroke-width="1.5"/>
  <text x="742" y="234" font-size="12" fill="#808080">Hz</text>

  <!-- zero line -->
  <line x1="170" y1="40" x2="170" y2="230" stroke="#808080" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- tick labels -->
  <text x="123" y="250" font-size="12" fill="#808080" text-anchor="middle">&#8722;100</text>
  <text x="170" y="250" font-size="12" fill="#808080" text-anchor="middle">0</text>
  <text x="212" y="250" font-size="12" fill="#808080" text-anchor="end">100</text>
  <text x="310" y="250" font-size="12" fill="#808080" text-anchor="middle">300</text>
  <text x="403" y="250" font-size="12" fill="#808080" text-anchor="middle">500</text>
  <text x="497" y="250" font-size="12" fill="#808080" text-anchor="middle">700</text>
  <text x="590" y="250" font-size="12" fill="#808080" text-anchor="middle">900</text>
  <text x="683" y="250" font-size="12" fill="#808080" text-anchor="middle">1100</text>

  <!-- suppressed carrier (ghost) -->
  <line x1="403" y1="230" x2="403" y2="90" stroke="#808080" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="403" y="78" font-size="12" fill="#808080" text-anchor="middle">carrier (suppressed)</text>

  <!-- sum and difference bands -->
  <line x1="310" y1="230" x2="310" y2="120" stroke="#4a90d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="497" y1="230" x2="497" y2="120" stroke="#4a90d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="214" y1="230" x2="214" y2="150" stroke="#4a90d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="590" y1="230" x2="590" y2="150" stroke="#4a90d9" stroke-width="4" stroke-linecap="round"/>
  <line x1="683" y1="230" x2="683" y2="175" stroke="#4a90d9" stroke-width="4" stroke-linecap="round"/>
  <text x="310" y="112" font-size="10.5" fill="#4a90d9" text-anchor="middle">500&#8722;200</text>
  <text x="497" y="112" font-size="10.5" fill="#4a90d9" text-anchor="middle">500+200</text>
  <text x="225" y="143" font-size="10.5" fill="#4a90d9" text-anchor="middle">500&#8722;400</text>
  <text x="590" y="143" font-size="10.5" fill="#4a90d9" text-anchor="middle">500+400</text>
  <text x="683" y="167" font-size="10.5" fill="#4a90d9" text-anchor="middle">500+600</text>

  <!-- negative-frequency difference band -->
  <line x1="123" y1="230" x2="123" y2="175" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/>
  <text x="123" y="166" font-size="11" fill="#d9534f" text-anchor="middle">500&#8722;600</text>

  <!-- fold arc -->
  <path d="M 126 173 Q 160 70 210 226" fill="none" stroke="#d9534f" stroke-width="1.75" marker-end="url(#foldArrow)"/>
  <text x="192" y="68" font-size="12" fill="#d9534f" text-anchor="start">folds about 0 Hz,</text>
  <text x="192" y="83" font-size="12" fill="#d9534f" text-anchor="start">phase inverted</text>

  <!-- folded band, drawn downward -->
  <line x1="221" y1="230" x2="221" y2="285" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/>

  <!-- resulting band after the subtraction -->
  <line x1="228" y1="230" x2="228" y2="205" stroke="#e8973a" stroke-width="4" stroke-linecap="round"/>
  <text x="240" y="272" font-size="12" fill="#d9534f">the folded band arrives at 100 Hz in opposite phase</text>
  <text x="240" y="288" font-size="12" fill="#e8973a">the two subtract &#8212; the remainder is the audible band</text>
</svg>
